<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 560" width="1160" height="560" role="img" aria-label="What the agent can and cannot reach">
  <defs>
    <linearGradient id="bgS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e1a"/><stop offset="100%" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="okG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#37e0c8"/><stop offset="100%" stop-color="#37b0e0"/></linearGradient>
    <linearGradient id="noG" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ff6b6b"/><stop offset="100%" stop-color="#ff9d6b"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#4f8cff"/><stop offset="100%" stop-color="#37e0c8"/></linearGradient>
    <style>
      .L { font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif; }
      .ttl { font-size:13px; font-weight:700; letter-spacing:1.6px; fill:#5b7fb5; }
      .h { font-size:16px; font-weight:700; fill:#eaf1ff; }
      .b { font-size:13px; fill:#8fa6c9; }
      .m { font-family:ui-monospace,'SF Mono','Cascadia Code',Menlo,Consolas,monospace; font-size:12.5px; fill:#9db3d4; }
      .g { font-size:13.5px; fill:#c2cee0; }
    </style>
  </defs>

  <rect width="1160" height="560" fill="url(#bgS)"/>

  <!-- LEFT: allowed -->
  <rect x="20" y="20" width="548" height="520" rx="18" fill="#0c1a20" stroke="url(#okG)" stroke-width="2" stroke-opacity="0.7"/>
  <rect x="20" y="20" width="548" height="46" rx="18" fill="#0f2430"/>
  <rect x="20" y="48" width="548" height="18" fill="#0f2430"/>
  <text x="48" y="50" class="L ttl" fill="#7ce8d4">WHAT THE AGENT CAN REACH</text>

  <g>
    <!-- workspace -->
    <circle cx="60" cy="106" r="14" fill="#37e0c8" fill-opacity="0.16" stroke="#37e0c8" stroke-opacity="0.6"/>
    <path d="M54 102 l6 5 7 -8" fill="none" stroke="#7ce8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="102" class="L h" font-size="15px">Your workspace</text>
    <text x="88" y="124" class="m">/workspace  —  read and write</text>
    <text x="88" y="146" class="L b">The one directory you chose. Real files, real edits.</text>

    <!-- pkg -->
    <circle cx="60" cy="188" r="14" fill="#37e0c8" fill-opacity="0.16" stroke="#37e0c8" stroke-opacity="0.6"/>
    <path d="M54 184 l6 5 7 -8" fill="none" stroke="#7ce8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="184" class="L h" font-size="15px">Package registries</text>
    <text x="88" y="206" class="L b">So it can install what your project needs.</text>

    <!-- model -->
    <circle cx="60" cy="252" r="14" fill="#37e0c8" fill-opacity="0.16" stroke="#37e0c8" stroke-opacity="0.6"/>
    <path d="M54 248 l6 5 7 -8" fill="none" stroke="#7ce8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="248" class="L h" font-size="15px">Your model provider</text>
    <text x="88" y="270" class="L b">The API route you configure. Keys stay in the volume.</text>

    <!-- web -->
    <circle cx="60" cy="316" r="14" fill="#37e0c8" fill-opacity="0.16" stroke="#37e0c8" stroke-opacity="0.6"/>
    <path d="M54 312 l6 5 7 -8" fill="none" stroke="#7ce8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="316" class="L h" font-size="15px">The public web</text>
    <text x="88" y="338" class="L b">For search and documentation, as any tool would.</text>

    <!-- shell -->
    <circle cx="60" cy="380" r="14" fill="#37e0c8" fill-opacity="0.16" stroke="#37e0c8" stroke-opacity="0.6"/>
    <path d="M54 376 l6 5 7 -8" fill="none" stroke="#7ce8d4" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="88" y="380" class="L h" font-size="15px">A confined shell</text>
    <text x="88" y="402" class="L b">Commands run under a kernel-enforced file policy.</text>
  </g>

  <line x1="48" y1="438" x2="540" y2="438" stroke="#1d5060" stroke-width="1"/>
  <text x="48" y="466" class="L b" fill="#7ce8d4">Every write outside the workspace is denied — and the</text>
  <text x="48" y="488" class="L b" fill="#7ce8d4">denial is reported, never silently ignored.</text>
  <text x="48" y="518" class="m" fill="#4e8f92">Default file policy: workspace-write</text>

  <!-- RIGHT: not allowed -->
  <rect x="592" y="20" width="548" height="520" rx="18" fill="#1a1016" stroke="url(#noG)" stroke-width="2" stroke-opacity="0.6"/>
  <rect x="592" y="20" width="548" height="46" rx="18" fill="#2a1622"/>
  <rect x="592" y="48" width="548" height="18" fill="#2a1622"/>
  <text x="620" y="50" class="L ttl" fill="#ff9d9d">WHAT IT CANNOT REACH</text>

  <g>
    <!-- outside workspace -->
    <circle cx="632" cy="106" r="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.55"/>
    <path d="M626 100 l12 12 M638 100 l-12 12" stroke="#ff9d9d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="660" y="102" class="L h" font-size="15px">Anything outside the workspace</text>
    <text x="660" y="124" class="L b">No home directory. No other drive. No system files.</text>

    <!-- docker socket -->
    <circle cx="632" cy="188" r="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.55"/>
    <path d="M626 182 l12 12 M638 182 l-12 12" stroke="#ff9d9d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="660" y="184" class="L h" font-size="15px">The Docker daemon</text>
    <text x="660" y="206" class="L b">The socket is never mounted. Reaching it would mean</text>
    <text x="660" y="226" class="L b">root on your machine, so it is off by design.</text>

    <!-- root -->
    <circle cx="632" cy="274" r="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.55"/>
    <path d="M626 268 l12 12 M638 268 l-12 12" stroke="#ff9d9d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="660" y="270" class="L h" font-size="15px">Root inside the container</text>
    <text x="660" y="292" class="L b">Capabilities are dropped to none and the process</text>
    <text x="660" y="312" class="L b">runs unprivileged.</text>

    <!-- privileged -->
    <circle cx="632" cy="360" r="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.55"/>
    <path d="M626 354 l12 12 M638 354 l-12 12" stroke="#ff9d9d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="660" y="356" class="L h" font-size="15px">A privileged container</text>
    <text x="660" y="378" class="L b">Never. It would defeat the point of running in Docker.</text>

    <!-- other containers -->
    <circle cx="632" cy="428" r="14" fill="#ff6b6b" fill-opacity="0.14" stroke="#ff6b6b" stroke-opacity="0.55"/>
    <path d="M626 422 l12 12 M638 422 l-12 12" stroke="#ff9d9d" stroke-width="2.4" stroke-linecap="round"/>
    <text x="660" y="424" class="L h" font-size="15px">Other containers on your machine</text>
    <text x="660" y="446" class="L b">Its own network only. It cannot see or touch them.</text>
  </g>

  <line x1="620" y1="478" x2="1112" y2="478" stroke="#5c2630" stroke-width="1"/>
  <text x="620" y="506" class="L b" fill="#ff9d9d">The container is the boundary. Everything inside it is</text>
  <text x="620" y="528" class="L b" fill="#ff9d9d">disposable; everything outside it is untouched.</text>
</svg>
